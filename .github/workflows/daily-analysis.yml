name: Daily Subscription Analysis

on:
  schedule:
    - cron: "30 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  DEBIAN_FRONTEND: noninteractive # apt 설치 시 인터랙티브 팝업 방지

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 전체 타임아웃 단축 (문제가 생기면 빨리 종료되도록)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright System Dependencies
        # 브라우저 실행에 필요한 최소한의 시스템 패키지만 먼저 설치합니다.
        # playwright install-deps는 너무 많은 폰트를 설치하므로 직접 핵심 패키지만 설치하여 속도를 높입니다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Install Playwright Chromium
        # 시스템 패키지 설치 후 브라우저만 다운로드합니다.
        run: npx playwright install chromium

      - name: Verify Gemini CLI
        run: npx gemini --version || echo "Gemini CLI not found"

      - name: Restore Gemini & Kakao Auth
        run: |
          mkdir -p ~/.gemini
          echo '${{ secrets.GEMINI_OAUTH_CREDS }}' > ~/.gemini/oauth_creds.json
          echo '{"security":{"auth":{"selectedType":"oauth-personal"}}}' > ~/.gemini/settings.json
          echo '${{ secrets.KAKAO_TOKEN_JSON }}' > kakao_token.json

      - name: Run Analysis
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" > .env
          chmod +x auto-run.sh
          ./auto-run.sh
        continue-on-error: true

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/results/
          git add backend/data/downloads/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update analysis results and PDFs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
