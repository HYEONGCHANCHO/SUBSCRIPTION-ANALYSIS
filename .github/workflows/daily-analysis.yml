name: Daily Subscription Analysis

on:
  schedule:
    - cron: "30 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

env:
  # 2026년 기준 Node.js 24를 기본으로 사용
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # 최신 메이저 버전(v5 이상)이 출시된 경우 이를 사용하면 경고가 사라집니다.
      - name: Checkout repository
        uses: actions/checkout@v4 # 또는 v5가 있다면 v5로 자동 전환 시도

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x' # 특정 버전을 명시하여 엔진 선택 명확화
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Restore Gemini CLI Auth
        run: |
          mkdir -p ~/.gemini
          echo '${{ secrets.GEMINI_OAUTH_CREDS }}' > ~/.gemini/oauth_creds.json
          echo '{"security":{"auth":{"selectedType":"oauth-personal"}}}' > ~/.gemini/settings.json

      - name: Run Analysis
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" > .env
          chmod +x auto-run.sh
          ./auto-run.sh

      - name: Commit and Push Results (including PDFs)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/results/
          git add backend/data/downloads/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update analysis results and download notice PDFs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
