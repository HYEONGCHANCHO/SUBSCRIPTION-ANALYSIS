name: Daily Subscription Analysis

on:
  schedule:
    - cron: "30 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 전체 작업을 최대 60분으로 제한 (6시간 방치 방지)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4는 Node 20/24를 지원함

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Restore Gemini & Kakao Auth
        run: |
          mkdir -p ~/.gemini
          echo '${{ secrets.GEMINI_OAUTH_CREDS }}' > ~/.gemini/oauth_creds.json
          echo '{"security":{"auth":{"selectedType":"oauth-personal"}}}' > ~/.gemini/settings.json
          echo '${{ secrets.KAKAO_TOKEN_JSON }}' > kakao_token.json

      - name: Run Analysis
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" > .env
          chmod +x auto-run.sh
          ./auto-run.sh
        continue-on-error: true

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/results/
          git add backend/data/downloads/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update analysis results and PDFs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
